			// Set the theme before the first stylesheet, so a dark choice does not paint light first.
			// The application wrapper in @auditboard/application-shell writes this key from the saved setting and owns data-theme after boot.
			(function () {
				let theme = 'light';
				try {
					const colorMode = localStorage.getItem('luna-color-mode');
					if (colorMode === 'dark' || (colorMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
						theme = 'dark';
					}
				} catch {
					// The browser can block storage, for example in a private window. Then the first paint is light.
				}
				document.documentElement.setAttribute('data-theme', theme);
			})();
